<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home HQ</title>
  <!-- Home HQ, adapted from Wes Bos photo-frame-dashboard (MIT). Fonts are bundled locally. -->
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="icon" href="%BASE_URL%icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views/frame.css">
  <script>
    // 100vh can disagree with the visible WebView, so --vh tracks innerHeight
    // and the shell uses calc(var(--vh) * 100).
    (function () {
      function setVh() {
        var h = window.innerHeight || document.documentElement.clientHeight;
        if (h) document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
      }
      setVh();
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
      window.addEventListener('pageshow', setVh);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setVh);
    })();
  </script>
</head>
<body>
  <div id="root">
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections">
      <button class="rail-item" data-go="home"><svg class="i" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="shopping"><svg class="i" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8L21 8H6.5"/><circle cx="10" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Shopping</span></button>
      <button class="rail-clock" id="railClock" aria-label="Clock"></button>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-shopping" data-view="shopping"></section>
      <div class="banners" id="banners"></div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="takeover" id="takeover" role="alertdialog"></div>
    <div class="ambient" id="ambient"></div>
    <div class="night" id="night"></div>
    <div class="demo" id="demo"></div>
    <div class="frame-status" id="frameStatus"><i></i><span>calendar sample</span></div>
  </div>
  </div>

  <script>
    // Wall-display self-healing: if the app bundle failed to load (e.g. a stale page right after a
    // deploy, or a network blip), reload until it starts.
    setTimeout(function () { if (!window.App) location.reload(); }, 10000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
